<!--
  Active-response wiring. Add both blocks inside <ossec_config> on the Wazuh MANAGER
  (/var/ossec/etc/ossec.conf), then restart the manager.

  The executable (ot_soar_response.py) must be present on the AGENT at
  /var/ossec/active-response/bin/, mode 750, owner root:wazuh.

  <location>local</location> runs the response on the agent that produced the
  alert, which is the agent closest to the OT. That keeps the response near the
  process and off any central box.
-->
<command>
  <name>ot-soar-playbook</name>
  <executable>ot_soar_response.py</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<active-response>
  <command>ot-soar-playbook</command>
  <location>local</location>
  <rules_id>100200</rules_id>
</active-response>
